# Hand-curated student-focused conferences. This is the "verified" list.
#
# Fields (only name + url are required):
#   name, url           conference name and homepage
#   dates_url           page to scrape dates from, if not the homepage
#   start, end          YYYY-MM-DD. If set, these are used as-is (no ⚠️ badge).
#                       Once they pass, the tracker goes back to scraping the site.
#   location, online    "Boston, MA" / true
#   deadline            next registration / scholarship / abstract deadline (YYYY-MM-DD)
#   deadline_label      e.g. "Scholarship", "Abstracts", "Registration"
#   deadline_url        link to apply
#   topics              short tags shown in the "Focus" column
#   notes               anything else
#
# Without start/end, the tracker scrapes the site each day and marks the dates ⚠️ (unverified).

